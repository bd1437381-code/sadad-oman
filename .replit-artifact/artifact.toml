kind = "web"
previewPath = "/"
title = "بوابة سداد عُمان"
version = "1.0.0"
id = "artifacts/sadad-oman"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19994

[services.development]
run = "pnpm --filter @workspace/sadad-oman run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sadad-oman", "run", "build" ]
publicDir = "artifacts/sadad-oman/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19994"
BASE_PATH = "/"
